[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "phase_router_rs"
version = "0.1.0"
description = "Fast deterministic load-balancing via cyclic phase routing"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.maturin]
features = ["pyo3/extension-module"]
