[package]
name = "phase_router_rs"
version = "0.1.0"
edition = "2021"
description = "Deterministic capacity-aware routing via cyclic phase arithmetic"
license = "MIT"
repository = "https://github.com/TSltd/phase_router_rs"
keywords = ["routing", "load-balancing", "moe", "deterministic"]
categories = ["algorithms", "science"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Enable the rank/select kernel (`router_rs`) and broadword primitives.
# Off by default so the existing kernel/build path is untouched until merged.
default = []
rank-select = []

[dependencies]
rayon = "1.8"
rand = "0.8"
rand_chacha = "0.3"
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[[example]]
name = "quality_probe"
required-features = ["rank-select"]

[[example]]
name = "moe_bench_rs"
required-features = ["rank-select"]

[[example]]
name = "spectral_probe"
required-features = ["rank-select"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
